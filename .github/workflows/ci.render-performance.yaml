name: CI render performance advisory

# Opt-in only (expensive OSMesa campaign). Never auto-runs on path match alone.
# PR path:
#   1. Decide job asks whether the advisory is needed for acceptance.
#   2. Add label `run-render-performance` to trigger the campaign.
# Manual path: workflow_dispatch with confirm_needed_for_acceptance=true.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "mujoco_ros/render_core/**"
      - "mujoco_ros/include/mujoco_ros/rendering/**"
      - "mujoco_ros/include/mujoco_ros/offscreen_camera.hpp"
      - "mujoco_ros/src/offscreen_camera.cpp"
      - "mujoco_ros/src/offscreen_rendering.cpp"
      - "mujoco_ros/test/render_performance_test.cpp"
      - "mujoco_ros/test/run_render_performance_*.sh"
      - "mujoco_ros/test/merge_render_performance_trials.py"
      - "mujoco_ros/test/render_performance_report.py"
      - "mujoco_ros/test/test_render_performance_report.py"
      - "mujoco_ros/test/render_performance_report_fixtures/**"
      - "mujoco_ros/CMakeLists.txt"
      - "mujoco_ros/src/CMakeLists.txt"
      - "mujoco_ros/test/CMakeLists.txt"
      - ".github/workflows/ci.render-performance.yaml"
  workflow_dispatch:
    inputs:
      confirm_needed_for_acceptance:
        description: Confirm this advisory is needed for acceptance (required to run the campaign).
        required: true
        type: boolean
        default: false
      baseline_sha:
        description: Optional baseline commit SHA; defaults to hybrid-devel.
        required: false
        type: string
      candidate_sha:
        description: Optional candidate commit SHA; defaults to the selected ref.
        required: false
        type: string
      pull_request_number:
        description: Optional pull request number for the advisory comment.
        required: false
        type: number
        default: 0

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-render-performance-advisory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ROS_DISTRO: humble
  MUJOCO_VERSION: "3.3.5"
  DOCKER_IMAGE: ubiagni/mujoco_ros:humble-ci
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Share object keys across baseline/candidate workspace paths in one campaign.
  CCACHE_NOHASHDIR: "1"
  ADVISORY_LABEL: run-render-performance

jobs:
  decide:
    name: "Decide: need OSMesa advisory for acceptance?"
    runs-on: ubuntu-latest
    outputs:
      run_benchmark: ${{ steps.gate.outputs.run_benchmark }}
      pull_request_number: ${{ steps.gate.outputs.pull_request_number }}
    steps:
      - name: Evaluate opt-in gate
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          DISPATCH_CONFIRM: ${{ github.event.inputs.confirm_needed_for_acceptance || 'false' }}
          DISPATCH_PR: ${{ github.event.inputs.pull_request_number || '0' }}
        run: |
          set -euo pipefail
          run_benchmark=false
          pr_number=0

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            pr_number="${DISPATCH_PR}"
            if [[ "${DISPATCH_CONFIRM}" == "true" ]]; then
              run_benchmark=true
            fi
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            pr_number="${PR_NUMBER}"
            IFS=',' read -r -a labels <<< "${PR_LABELS}"
            for label in "${labels[@]}"; do
              if [[ "${label}" == "${ADVISORY_LABEL}" ]]; then
                run_benchmark=true
                break
              fi
            done
          fi


          echo "run_benchmark=${run_benchmark}" >> "${GITHUB_OUTPUT}"
          echo "pull_request_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Render performance advisory gate"
            echo
            if [[ "${run_benchmark}" == "true" ]]; then
              echo "Opt-in confirmed. Expensive OSMesa campaign will run."
            else
              echo "Opt-in **not** set. Campaign skipped (no runner time for the benchmark)."
              echo
              echo "If this change needs the advisory for acceptance:"
              echo "1. Decide it is necessary for acceptance."
              echo "2. Trigger by adding label \`${ADVISORY_LABEL}\` on the PR"
              echo "   (or re-run this workflow via workflow_dispatch with"
              echo "   confirm_needed_for_acceptance=true)."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Ask on the pull request
        if: github.event_name == 'pull_request' && steps.gate.outputs.run_benchmark != 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-tag: render-performance-advisory-gate
          edit-mode: replace
          body: |
            ## Render performance advisory — decision needed

            This PR touches render/performance paths. The OSMesa advisory campaign is **opt-in** (it is expensive).

            1. **Decide** whether it is necessary for acceptance on this PR.
            2. **Trigger** only if yes: add the label `run-render-performance`.

            Leave the label off to skip the campaign and save runner time.
            Remove the label later to stop re-running it on new pushes.

      - name: Confirm trigger on the pull request
        if: github.event_name == 'pull_request' && steps.gate.outputs.run_benchmark == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-tag: render-performance-advisory-gate
          edit-mode: replace
          body: |
            ## Render performance advisory — running

            Label `run-render-performance` is present, so the OSMesa advisory campaign will run for this PR.
            Remove the label if it should not run on later pushes.

  benchmark:
    name: OSMesa advisory benchmark
    needs: decide
    if: needs.decide.outputs.run_benchmark == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ubiagni/mujoco_ros:humble-ci
      env:
        MUJOCO_DIR: /root/mujoco/3.3.5
        CCACHE_DIR: ${{ github.workspace }}/.ccache
        CCACHE_NOHASHDIR: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve baseline and candidate SHAs
        id: refs
        shell: bash
        env:
          INPUT_BASELINE: ${{ github.event.inputs.baseline_sha || '' }}
          INPUT_CANDIDATE: ${{ github.event.inputs.candidate_sha || '' }}
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          baseline_sha="${INPUT_BASELINE}"
          candidate_sha="${INPUT_CANDIDATE}"
          if [[ -z "${candidate_sha}" && -n "${PR_HEAD}" ]]; then
            candidate_sha="${PR_HEAD}"
          fi
          if [[ -z "${candidate_sha}" ]]; then
            candidate_sha="${GITHUB_SHA}"
          fi
          if [[ -z "${baseline_sha}" && -n "${PR_BASE}" ]]; then
            baseline_sha="${PR_BASE}"
          fi
          if [[ -z "${baseline_sha}" || "${baseline_sha}" == "0000000000000000000000000000000000000000" ]]; then
            git fetch origin hybrid-devel --depth=1
            baseline_sha="$(git merge-base "${candidate_sha}" origin/hybrid-devel)"
          fi
          echo "baseline_sha=${baseline_sha}" >> "${GITHUB_OUTPUT}"
          echo "candidate_sha=${candidate_sha}" >> "${GITHUB_OUTPUT}"


      # Prefer the ROS 2 matrix ccache (ci.ros2 plain prefix ccache-${ROS_DISTRO}).
      # Keep the private render-perf key as a fallback when no matrix object matches.
      - name: Restore matrix ccache
        id: ccache-matrix
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.ROS_DISTRO }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.ROS_DISTRO }}-${{ github.sha }}
            ccache-${{ env.ROS_DISTRO }}

      - name: Restore advisory ccache fallback
        id: ccache-advisory
        if: steps.ccache-matrix.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-render-perf-${{ env.ROS_DISTRO }}-${{ env.MUJOCO_VERSION }}-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/package.xml') }}
          restore-keys: |
            ccache-render-perf-${{ env.ROS_DISTRO }}-${{ env.MUJOCO_VERSION }}-${{ runner.os }}-

      - name: Zero ccache stats
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache --zero-stats --max-size=10G
          ccache --show-config | head -n 40 || true
          echo "matrix_cache_key=${{ steps.ccache-matrix.outputs.cache-matched-key }}"
          echo "advisory_cache_key=${{ steps.ccache-advisory.outputs.cache-matched-key }}"

      - name: Run OSMesa interleaved advisory campaign
        shell: bash
        env:
          CCACHE_DIR: ${{ env.CCACHE_DIR }}
          CCACHE_NOHASHDIR: "1"
        run: |
          set -euo pipefail
          chmod +x mujoco_ros/test/run_render_performance_advisory_ci.sh
          chmod +x mujoco_ros/test/run_render_performance_interleaved_bccb.sh
          mujoco_ros/test/run_render_performance_advisory_ci.sh \
            --repo-root "${GITHUB_WORKSPACE}" \
            --baseline-sha "${{ steps.refs.outputs.baseline_sha }}" \
            --candidate-sha "${{ steps.refs.outputs.candidate_sha }}" \
            --artifacts-dir "${RUNNER_TEMP}/render-performance"

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      # Save into both namespaces even on failure so matrix and later advisory
      # runs can reuse this job's compiles.
      - name: Save matrix ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.ROS_DISTRO }}-${{ github.sha }}-${{ github.run_id }}-advisory

      - name: Save advisory ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-render-perf-${{ env.ROS_DISTRO }}-${{ env.MUJOCO_VERSION }}-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/package.xml') }}-${{ github.run_id }}

      # Absolute ${{ runner.temp }}/** globs make upload-artifact LCA=/ and nest
      # paths as __w/_temp/...; stage under the workspace so download is flat.
      - name: Stage benchmark artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/render-performance"
          dst="${GITHUB_WORKSPACE}/render-performance-out"
          rm -rf "${dst}"
          mkdir -p "${dst}"
          for sub in raw logs reports; do
            if [[ -d "${src}/${sub}" ]]; then
              cp -a "${src}/${sub}" "${dst}/"
            fi
          done
          find "${dst}" -type f | head -n 20 || true

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-performance-${{ github.run_id }}
          path: render-performance-out
          if-no-files-found: warn

  advisory-report:
    name: Publish advisory report
    needs:
      - decide
      - benchmark
    if: needs.benchmark.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          name: render-performance-${{ github.run_id }}
          path: artifacts

      - name: Load summary markdown
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          # Prefer flat stage layout; fall back to nested upload leftovers.
          summary_path="$(find artifacts -name summary.md -print -quit)"
          if [[ -z "${summary_path}" || ! -f "${summary_path}" ]]; then
            echo "missing summary report artifact" >&2
            find artifacts -type f | head -n 50 >&2 || true
            exit 1
          fi
          {
            echo "path=${summary_path}"
            echo "body<<EOF"
            cat "${summary_path}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Write branch push summary
        if: needs.decide.outputs.pull_request_number == '0'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Render performance advisory report"
            echo
            cat "${{ steps.summary.outputs.path }}"
          } >> "${GITHUB_STEP_SUMMARY}"
          python3 - <<'PY' "${{ steps.summary.outputs.path }}"
          import json, pathlib, sys
          summary_json = pathlib.Path(sys.argv[1]).with_name("summary.json")
          payload = json.loads(summary_json.read_text(encoding="utf-8"))
          if payload.get("mode") == "candidate_only":
              print("::notice title=Render performance advisory::candidate-only (no baseline harness)")
              raise SystemExit(0)
          for report in payload.get("camera_reports", []):
              camera_count = report["camera_count"]
              for metric, value in report.get("regressions", {}).items():
                  if value > 0.0:
                      print(
                          f"::warning title=Render performance advisory (cam{camera_count})::"
                          f"{metric}={value:.3f}%"
                      )
          PY

      - name: Update pull request comment
        if: needs.decide.outputs.pull_request_number != '0'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ needs.decide.outputs.pull_request_number }}
          comment-tag: render-performance-advisory
          edit-mode: replace
          body: |
            ## Render performance advisory report

            OSMesa Release campaign (camera counts 1/2/4, 1000 iterations).

            ${{ steps.summary.outputs.body }}

            Raw receipts, logs, and per-camera reports are attached to workflow artifacts.
            Positive normalized regressions (when a baseline exists) are advisory warnings only; this job stays green unless build, harness, timeout, or receipt validation fails.
