name: Docker ROS 1

# Weekly/manual image refresh, and reusable build for CI when docker inputs change.
# PR/push path triggers live in ci.ros1.yaml (call this workflow, then test).
on:
  schedule:
    # 6 AM UTC every Sunday
    - cron: "0 6 * * 6"
  workflow_dispatch:
  workflow_call:
    inputs:
      rebuild:
        description: When false, succeed without building (CI caller no-op so matrix outputs propagate).
        type: boolean
        required: false
        default: true

# Fixed group (not github.workflow): CI may call this via workflow_call; using
# github.workflow would collide with the caller concurrency group.
concurrency:
  group: docker-ros1-image
  cancel-in-progress: true

jobs:
  push-gate:
    name: Push skip gate
    # Always run so job outputs propagate. Non-push / workflow_call → skip=false;
    # push uses ci_push_skip.py (Version Bot; docker does not pass merged-PR bases).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - id: skip
        name: Decide whether to skip docker push
        env:
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "push" ]]; then
            echo "skip=false" | tee -a "${GITHUB_OUTPUT}"
            exit 0
          fi
          author_name=$(git log -1 --format=%an "${SHA}")
          author_email=$(git log -1 --format=%ae "${SHA}")
          python3 .versioning/scripts/ci_push_skip.py \
            --author-name "${author_name}" --author-email "${author_email}"

  # No-op success when CI calls with rebuild=false. A skipped reusable-workflow
  # job empties downstream matrix outputs; this job keeps the caller green.
  noop:
    name: Skip image rebuild
    needs: push-gate
    if: ${{ !cancelled() && needs.push-gate.result != 'failure' && needs.push-gate.result != 'cancelled' && needs.push-gate.outputs.skip == 'false' && github.event_name == 'workflow_call' && inputs.rebuild == false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Docker inputs unchanged; no image refresh."

  build:
    needs: push-gate
    if: ${{ !cancelled() && needs.push-gate.result != 'failure' && needs.push-gate.result != 'cancelled' && needs.push-gate.outputs.skip == 'false' && (github.event_name != 'workflow_call' || inputs.rebuild) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Noble is the full image; jammy (Python 3.10) is smoke-only.
          - ROS_DISTRO: one
            BASE_DOCKER_NAME: noble
            IMAGE_TAG: one-ci
          - ROS_DISTRO: one
            BASE_DOCKER_NAME: jammy
            IMAGE_TAG: one-jammy-ci
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    env:
      # Must match CI DOCKER_IMAGE (…/<IMAGE_TAG>), not github.job.
      IMAGE: ubiagni/mujoco_ros:${{ matrix.IMAGE_TAG }}
      MUJOCO_VERSIONS: 4.0.1

    steps:
      - name: Check for apt updates
        uses: rhaschke/docker-run-action@main
        continue-on-error: true
        id: apt
        with:
          image: ${{ env.IMAGE }}
          shell: bash
          run: |
            apt-get update
            have_updates=$(apt-get --simulate upgrade | grep -q "^0 upgraded, 0 newly installed, 0 to remove and 0 not upgraded.$" && echo false || echo true)
            echo "no_cache=$have_updates" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event_name != 'schedule' || steps.apt.outputs.no_cache }}
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event_name != 'schedule' || steps.apt.outputs.no_cache }}
        with:
          file: .docker/Dockerfile.ros1
          build-args: |
            ROS_DISTRO=${{ matrix.ROS_DISTRO }}
            BASE_DOCKER_NAME=${{ matrix.BASE_DOCKER_NAME }}
            MUJOCO_VERSIONS=${{ env.MUJOCO_VERSIONS }}
            IMAGE_PREFIX=${{ matrix.ROS_DISTRO == 'one' && 'ubiagni/' || '' }}
          push: true
          no-cache: ${{ steps.apt.outputs.no_cache || github.event_name == 'workflow_dispatch' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}
          cache-to: type=inline
          tags: ${{ env.IMAGE }}
