name: CI ROS 2

on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run the full render/backend matrix instead of the reduced dev matrix.
        required: false
        default: false
        type: boolean
      coverage:
        description: Include coverage jobs and upload Codecov reports. Implies full_matrix.
        required: false
        default: false
        type: boolean
      clang_tidy:
        description: Include the Humble GLFW clang-tidy delta job.
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - wip-ros-humble
      - hybrid-devel
      - dev/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-policy:
    name: Select CI matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
    steps:
      - id: policy
        name: Build matrix
        run: |
          full_matrix=false
          coverage=false
          clang_tidy=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            full_matrix="${{ inputs.full_matrix }}"
            coverage="${{ inputs.coverage }}"
            clang_tidy="${{ inputs.clang_tidy }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.ref_name }}" != dev/* ]]; then
              full_matrix=true
              coverage=true
              clang_tidy=true
            fi
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.base_ref }}" == "hybrid-devel" || "${{ github.head_ref }}" != dev/* ]]; then
              full_matrix=true
              coverage=true
              clang_tidy=true
            fi
          fi

          if [[ "${coverage}" == "true" ]]; then
            full_matrix=true
          fi

          if [[ "${full_matrix}" != "true" ]]; then
            if [[ "${clang_tidy}" == "true" ]]; then
              matrix='{"include":[{"distro":"humble","render_backend":"GLFW","mujoco":"3.3.5","check":"plain"},{"distro":"humble","render_backend":"GLFW","mujoco":"3.3.5","check":"clang_tidy"}]}'
            else
              matrix='{"include":[{"distro":"humble","render_backend":"GLFW","mujoco":"3.3.5","check":"plain"}]}'
            fi
          elif [[ "${coverage}" == "true" ]]; then
            if [[ "${clang_tidy}" == "true" ]]; then
              matrix='{"include":[{"distro":"humble","render_backend":"GLFW","mujoco":"3.3.5","check":"clang_tidy"},{"distro":"humble","render_backend":"GLFW","mujoco":"3.3.5","check":"ccov"},{"distro":"humble","render_backend":"OSMESA","mujoco":"3.3.5","check":"ccov"},{"distro":"humble","render_backend":"DISABLE","mujoco":"3.3.5","check":"ccov"}]}'
            else
              matrix='{"include":[{"distro":"humble","render_backend":"GLFW","mujoco":"3.3.5","check":"ccov"},{"distro":"humble","render_backend":"OSMESA","mujoco":"3.3.5","check":"ccov"},{"distro":"humble","render_backend":"DISABLE","mujoco":"3.3.5","check":"ccov"}]}'
            fi
          elif [[ "${clang_tidy}" == "true" ]]; then
            matrix='{"include":[{"distro":"humble","render_backend":"GLFW","mujoco":"3.3.5","check":"plain"},{"distro":"humble","render_backend":"OSMESA","mujoco":"3.3.5","check":"plain"},{"distro":"humble","render_backend":"DISABLE","mujoco":"3.3.5","check":"plain"},{"distro":"humble","render_backend":"GLFW","mujoco":"3.3.5","check":"clang_tidy"}]}'
          else
            matrix='{"include":[{"distro":"humble","render_backend":"GLFW","mujoco":"3.3.5","check":"plain"},{"distro":"humble","render_backend":"OSMESA","mujoco":"3.3.5","check":"plain"},{"distro":"humble","render_backend":"DISABLE","mujoco":"3.3.5","check":"plain"}]}'
          fi

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  default:
    needs: ci-policy
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci-policy.outputs.matrix) }}

    env:
      BUILDER: colcon
      MUJOCO_DIR: /vol/mujoco/mujoco-${{ matrix.mujoco }} # for self-hosted runners
      DOCKER_RUN_OPTS: -e MUJOCO_DIR=/root/mujoco/${{ matrix.mujoco }} -e DISPLAY=:99.0
      DOCKER_IMAGE: ubiagni/mujoco_ros:${{ matrix.distro }}-ci

      # For now we have flags defined in the CMakeLists, using all flags makes the build break
      # I'll fix this once I find some time to do it
      # CXXFLAGS: -Wall -Wextra -Wwrite-strings -Wunreachable-code -Wpointer-arith -Wredundant-decls
      CXXFLAGS: -Wwrite-strings -Wunreachable-code -Wpointer-arith # rosidl triggers this in non-user code, so let's leave it out for now -Wredundant-decls
      CLANG_TIDY_ARGS: -fix -format -style=file
      # UPSTREAM_WORKSPACE: .github/workflows/upstream.ros2.rosinstall
      # Install Python MuJoCo matching the C++ MuJoCo version under test.
      # GLFW jobs additionally need xvfb.
      AFTER_INIT: >
        apt-get update -q;
        apt-get install -qy python3-pip${{ matrix.render_backend == 'GLFW' && ' xvfb' || '' }};
        python3 -m pip install mujoco==${{ matrix.mujoco }};
        ${{ matrix.render_backend == 'GLFW' && 'Xvfb :99 &' || '' }}
      # Pull any updates to the upstream workspace
      # AFTER_SETUP_UPSTREAM_WORKSPACE: vcs pull $BASEDIR/upstream_ws/src
      AFTER_SETUP_DOWNSTREAM_WORKSPACE: vcs pull $BASEDIR/downstream_ws/src
      # Clear ccache stats before and log the stats after the build
      AFTER_SETUP_CCACHE: ccache --zero-stats --max-size=10.0G
      AFTER_BUILD_TARGET_WORKSPACE: ccache --show-stats
      AFTER_BUILD_DOWNSTREAM_WORKSPACE: ccache --show-stats
      # Compile CCOV with Debug. Enable -Werror.
      TARGET_CMAKE_ARGS: >
        -DCMAKE_BUILD_TYPE=${{ matrix.check == 'ccov' && 'Debug' || 'Release'}}
        -DCMAKE_CXX_FLAGS="-Werror $CXXFLAGS${{ (matrix.check == 'clang_tidy' && ' -Wno-unknown-warning-option') || '' }}${{ (matrix.check == 'ccov' && ' --coverage -O2 -fno-omit-frame-pointer') || '' }}"
        -DBUILD_TESTING=${{ matrix.check == 'clang_tidy' && 'OFF' || 'ON' }}
        -DRENDER_BACKEND=${{ matrix.render_backend }}
      # UPSTREAM_CMAKE_ARGS: -DCMAKE_CXX_FLAGS= -DCMAKE_CXX_STANDARD=17

      CCACHE_DIR: ${{ github.workspace }}/.ccache
      BASEDIR: ${{ github.workspace }}/.work
      CLANG_TIDY_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/hybrid-devel' || github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || startsWith(github.ref_name, 'dev/') && 'refs/heads/hybrid-devel' || github.event.before }}
      BEFORE_CLANG_TIDY_CHECKS: |
        # Show list of applied checks
        (cd $TARGET_REPO_PATH; clang-tidy --list-checks)
      CC: ${{ (matrix.check == 'clang_tidy' && 'clang') || '' }}
      CXX: ${{ (matrix.check == 'clang_tidy' && 'clang++') || '' }}
      CLANG_TIDY: ${{ matrix.check == 'clang_tidy' }}
      CCOV: ${{ matrix.check == 'ccov' }}

    name: "${{ matrix.distro }} mj-${{ matrix.mujoco }} ${{ matrix.render_backend }}${{ matrix.check == 'plain' && ' + test' || '' }}${{ matrix.check == 'ccov' && ' + ccov' || ''}}${{ matrix.check == 'clang_tidy' && ' + clang-tidy (delta)' || '' }}"
    runs-on: ${{ matrix.render_backend == 'EGL' && matrix.distro || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      # - name: Cache upstream workspace
      #   uses: rhaschke/cache@main
      #   with:
      #     path: ${{ env.BASEDIR }}/upstream_ws
      #     key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}
      #     restore-keys: ${{ env.CACHE_PREFIX }}
      #   env:
      #     GHA_CACHE_SAVE: always
      #     CACHE_PREFIX: upstream_ws-${{ matrix.distro }}-${{ hashFiles('.github/workflows/upstream.rosinstall', '.github/workflows/ci.ros2.yaml') }}
      # The target directory cache doesn't include the source directory because
      # that comes from the checkout.  See "prepare target_ws for cache" task below
      - name: Cache target workspace
        if: matrix.check != 'ccov'
        uses: rhaschke/cache@main
        with:
          path: ${{ env.BASEDIR }}/target_ws
          key: ${{ env.CACHE_PREFIX }}-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_PREFIX }}
        env:
          GHA_CACHE_SAVE: always
          CACHE_PREFIX: target_ws-${{ matrix.check }}-${{ matrix.distro }}-${{ hashFiles('**/CMakeLists.txt', '**/package.xml', '.github/workflows/ci.ros2.yaml') }}
      - name: Cache ccache
        uses: rhaschke/cache@main
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-${{ github.sha }}
            ${{ env.CACHE_PREFIX }}
        env:
          GHA_CACHE_SAVE: always
          CACHE_PREFIX: ccache-${{ matrix.distro }}${{ matrix.check == 'ccov' && '-ccov' || '' }}

      - id: ici
        name: Run industrial_ci
        uses: ros-industrial/industrial_ci@master

      - name: Upload test artifacts (on failure)
        uses: actions/upload-artifact@v4
        if: failure() && (steps.ici.outputs.run_target_test || steps.ici.outputs.target_test_results)
        with:
          name: test-results-${{ matrix.distro }}-${{ matrix.render_backend }}-${{ matrix.check }}
          path: ${{ env.BASEDIR }}/target_ws/**/test_results/**/*.xml
      - name: Generate codecov report
        uses: rhaschke/lcov-action@main
        if: always() && matrix.check == 'ccov' && steps.ici.outputs.target_test_results == '0'
        with:
          docker: ${{ matrix.render_backend != 'EGL' && '$DOCKER_IMAGE' || '' }}
          workdir: ${{ env.BASEDIR }}/target_ws
          ignore: '"*/target_ws/build/*" "*/target_ws/install/*" "*/test/*"'
          output: ${{ env.BASEDIR }}/target_ws/coverage-${{ matrix.distro }}-${{ matrix.render_backend }}.info
      - name: Upload codecov report
        uses: codecov/codecov-action@v5
        if: always() && matrix.check == 'ccov' && steps.ici.outputs.target_test_results == '0'
        with:
          files: ${{ env.BASEDIR }}/target_ws/coverage-${{ matrix.distro }}-${{ matrix.render_backend }}.info
      - name: Upload clang-tidy changes
        uses: rhaschke/upload-git-patch-action@main
        if: always() && matrix.check == 'clang_tidy'
        with:
          name: clang-tidy
          path: ${{ env.BASEDIR }}/target_ws/src/$(basename $(pwd))
      - name: Prepare target_ws for cache
        if: always() && matrix.check != 'ccov'
        run: |
          du -sh ${{ env.BASEDIR }}/target_ws
          sudo find ${{ env.BASEDIR }}/target_ws -wholename '*/test_results/*' -delete
          sudo rm -rf ${{ env.BASEDIR }}/target_ws/src ${{ env.BASEDIR }}/target_ws/logs
          du -sh ${{ env.BASEDIR }}/target_ws
