name: Tag release

on:
  push:
    branches:
      - hybrid-main

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - id: tag
        name: Create annotated tag if missing
        run: |
          set -euo pipefail
          # Prints the new tag, or "tag exists" when the version is already tagged.
          tag=$(python3 .versioning/scripts/bump_versions.py --repo . tag)
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Push new tag
        if: steps.tag.outputs.tag != 'tag exists'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git push origin "refs/tags/${TAG}"

  # Compose Merged PRs + CHANGELOG + New Contributors? + Full Changelog, then publish.
  # Runs only when this run created the tag (same gate as docs).
  github-release:
    name: Create GitHub Release
    needs: tag
    if: needs.tag.outputs.tag != 'tag exists'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          python3 .versioning/scripts/create_github_release.py --repo . --tag "${TAG}"

  # GITHUB_TOKEN tag pushes do not start other workflows, so build released docs here
  # in the same run. Runs only when this run created the tag.
  # Checkout the hybrid-main tip that triggered this push (`github.sha`), not
  # `hybrid-devel`: a release PR with head hybrid-devel + delete_branch_on_merge
  # deletes that branch before this job runs. After rebase-merge the tip tree
  # matches what hybrid-devel had. Tags stay available via fetch-tags for
  # `make versioned` release trees.
  docs:
    name: Released documentation
    needs: tag
    if: needs.tag.outputs.tag != 'tag exists'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/sphinxdoc.yaml
    with:
      ref: ${{ github.sha }}
