name: Tag release

on:
  push:
    branches:
      - hybrid-main

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - id: tag
        name: Create annotated tag if missing
        run: |
          set -euo pipefail
          # Prints the new tag, or "tag exists" when the version is already tagged.
          tag=$(python3 .versioning/scripts/bump_versions.py --repo . tag)
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Push new tag
        if: steps.tag.outputs.tag != 'tag exists'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git push origin "refs/tags/${TAG}"

  # GITHUB_TOKEN tag pushes do not start other workflows, so build released docs here
  # in the same run. Runs only when this run created the tag.
  # The ref is hybrid-devel, not the new tag: `make versioned` builds devel/ from the
  # checkout, and the new tag is still visible there (fetch-tags) for its release tree.
  docs:
    name: Released documentation
    needs: tag
    if: needs.tag.outputs.tag != 'tag exists'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/sphinxdoc.yaml
    with:
      ref: hybrid-devel
