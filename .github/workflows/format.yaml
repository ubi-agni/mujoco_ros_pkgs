name: Format

on:
  workflow_dispatch:
  pull_request:
    branches:
      - hybrid-devel
  push:
    branches:
      - hybrid-devel

permissions:
  contents: read

jobs:
  push-gate:
    name: Push skip gate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - id: skip
        name: Decide whether to skip full CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          author_name=$(git log -1 --format=%an "${SHA}")
          author_email=$(git log -1 --format=%ae "${SHA}")
          merged_bases=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --paginate \
            --jq '.[] | select(.merged_at != null) | .base.ref')
          args=()
          while IFS= read -r base; do
            if [[ -n "${base}" ]]; then args+=(--pr-base "${base}"); fi
          done <<< "${merged_bases}"
          python3 .versioning/scripts/ci_push_skip.py \
            --author-name "${author_name}" --author-email "${author_email}" "${args[@]}"

  pre-commit:
    name: pre-commit
    needs: push-gate
    if: ${{ !cancelled() && needs.push-gate.result != 'failure' && needs.push-gate.result != 'cancelled' && (github.event_name != 'push' || needs.push-gate.outputs.skip == 'false') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Catkin lint is installed but not included in pre-commit
      # - name: Install catkin_lint
      #   uses: DavidPL1/install-catkin_lint-action@ros2
      - uses: pre-commit/action@v3.0.1
        id: precommit
      - name: Upload pre-commit changes
        if: failure() && steps.precommit.outcome == 'failure'
        uses: rhaschke/upload-git-patch-action@main
        with:
          name: pre-commit
