name: Docker ROS 2

on:
  schedule:
    # 6 AM UTC every Sunday
    - cron: "0 6 * * 6"
  workflow_dispatch:
  push:
    branches:
      - hybrid-devel
    paths:
      - '**/package.xml'
      - .docker
      - .dockignore
      - .github/workflows/docker.ros2.yaml
      - .github/workflows/*.ros2.rosinstall
  pull_request:
    branches:
      - hybrid-devel
    paths:
      - '**/package.xml'
      - .docker
      - .dockignore
      - .github/workflows/docker.ros2.yaml
      - .github/workflows/*.ros2.rosinstall


concurrency: # cancel any previous workflow(s) from the same PR or branch/tag
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  push-gate:
    name: Push skip gate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - id: skip
        name: Decide whether to skip docker push
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          author_name=$(git log -1 --format=%an "${SHA}")
          author_email=$(git log -1 --format=%ae "${SHA}")
          python3 .versioning/scripts/ci_push_skip.py \
            --author-name "${author_name}" --author-email "${author_email}"

  ci_ros2:
    needs: push-gate
    if: ${{ !cancelled() && needs.push-gate.result != 'failure' && needs.push-gate.result != 'cancelled' && (github.event_name != 'push' || needs.push-gate.outputs.skip == 'false') }}
    strategy:
      fail-fast: false
      matrix:
        ROS_DISTRO: [humble, jazzy]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    env:
      IMAGE: ubiagni/mujoco_ros:${{ matrix.ROS_DISTRO }}-${{ github.job }}
      MUJOCO_VERSIONS: 3.3.5

    steps:
      - name: Check for apt updates
        uses: rhaschke/docker-run-action@main
        continue-on-error: true
        id: apt
        with:
          image: ${{ env.IMAGE }}
          shell: bash
          run: |
            apt-get update
            have_updates=$(apt-get --simulate upgrade | grep -q "^0 upgraded, 0 newly installed, 0 to remove and 0 not upgraded.$" && echo false || echo true)
            echo "no_cache=$have_updates" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name != 'schedule' || steps.apt.outputs.no_cache }}
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name != 'schedule' || steps.apt.outputs.no_cache }}
        with:
          file: .docker/Dockerfile.ros2
          build-args: |
            ROS_DISTRO=${{ matrix.ROS_DISTRO }}
            BASE_DOCKER_NAME=${{ matrix.ROS_DISTRO }}
            MUJOCO_VERSIONS=${{ env.MUJOCO_VERSIONS }}
            IMAGE_PREFIX=${{ '' }}
          push: true
          no-cache: ${{ steps.apt.outputs.no_cache || github.event_name == 'workflow_dispatch' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}
          cache-to: type=inline
          tags: ${{ env.IMAGE }}
