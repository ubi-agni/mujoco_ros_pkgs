<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 90" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Runtime options transaction: parse the input, merge onto the current model options, validate the merged candidate, then write it, all under the physics mutex, all or nothing.">
  <defs>
    <marker id="ro-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e6b58"></path>
    </marker>
  </defs>
  <rect x="10" y="20" width="120" height="40" rx="7" fill="#e7ece9" stroke="#b9c4bd"></rect>
  <text x="70" y="44" text-anchor="middle" font-size="11.5" fill="#17211d">parse</text>
  <line x1="130" y1="40" x2="168" y2="40" stroke="#0e6b58" marker-end="url(#ro-a)"></line>

  <rect x="170" y="20" width="120" height="40" rx="7" fill="#e7ece9" stroke="#b9c4bd"></rect>
  <text x="230" y="44" text-anchor="middle" font-size="11.5" fill="#17211d">merge</text>
  <line x1="290" y1="40" x2="328" y2="40" stroke="#0e6b58" marker-end="url(#ro-a)"></line>

  <rect x="330" y="20" width="120" height="40" rx="7" fill="#e7ece9" stroke="#b9c4bd"></rect>
  <text x="390" y="44" text-anchor="middle" font-size="11.5" fill="#17211d">validate</text>
  <line x1="450" y1="40" x2="488" y2="40" stroke="#0e6b58" marker-end="url(#ro-a)"></line>

  <rect x="490" y="20" width="120" height="40" rx="7" fill="#dcefe8" stroke="#0e6b58" stroke-width="1.3"></rect>
  <text x="550" y="44" text-anchor="middle" font-size="11.5" font-weight="700" fill="#17211d">write</text>

  <text x="320" y="80" text-anchor="middle" font-size="10.5" fill="#52625a">all under physics_thread_mutex_ — any failure at parse or validate touches mjOption not at all</text>
</svg>
