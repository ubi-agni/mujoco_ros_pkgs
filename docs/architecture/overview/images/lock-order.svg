<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Lock order: physics_thread_mutex_, then PluginHost mutex, then RenderCore mutex, acquired top to bottom only, never reacquired upward.">
  <defs>
    <marker id="lk-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e6b58"></path>
    </marker>
  </defs>
  <rect x="30" y="20" width="270" height="42" rx="7" fill="#e7ece9" stroke="#b9c4bd"></rect>
  <text x="165" y="46" text-anchor="middle" font-size="11.5" font-weight="600" fill="#17211d">physics_thread_mutex_ (recursive)</text>
  <line x1="165" y1="62" x2="165" y2="88" stroke="#0e6b58" marker-end="url(#lk-a)"></line>

  <rect x="30" y="90" width="270" height="42" rx="7" fill="#e7ece9" stroke="#b9c4bd"></rect>
  <text x="165" y="116" text-anchor="middle" font-size="11.5" font-weight="600" fill="#17211d">PluginHost mutex_</text>
  <line x1="165" y1="132" x2="165" y2="158" stroke="#0e6b58" marker-end="url(#lk-a)"></line>

  <rect x="30" y="160" width="270" height="42" rx="7" fill="#e7ece9" stroke="#b9c4bd"></rect>
  <text x="165" y="186" text-anchor="middle" font-size="11.5" font-weight="600" fill="#17211d">RenderCore mutex_ / FrameBoundary mutex</text>

  <text x="330" y="70" font-size="10.5" fill="#a8461f">Never reacquired upward — once</text>
  <text x="330" y="86" font-size="10.5" fill="#a8461f">render/publish work has released</text>
  <text x="330" y="102" font-size="10.5" fill="#a8461f">physics_thread_mutex_, it never</text>
  <text x="330" y="118" font-size="10.5" fill="#a8461f">reaches back for it.</text>
</svg>
